<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>页面不存在 · 数信元宇宙</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232f5bea'/%3E%3Ctext x='32' y='43' font-size='32' font-family='sans-serif' font-weight='bold' fill='%23ffffff' text-anchor='middle'%3E%E6%95%B0%3C/text%3E%3C/svg%3E">
<!--
  ⚠️ 本页刻意做成「自包含」：样式全部内联，不引用 assets/ 下的任何文件。
  原因：GitHub Pages 返回自定义 404 时，浏览器地址栏 URL 保持不变。
  例如访问 /sxx-dept-site/a/b/c 时，相对路径 assets/css/style.css 会被解析成
  /sxx-dept-site/a/b/assets/css/style.css，外部样式表必然加载失败、页面变成裸 HTML。
  内联样式与「根路径自适应」脚本共同解决这个问题，请勿改回外链方式。
-->
<style>
*,*::before,*::after{box-sizing:border-box;}
:root{
  --bg:#f6f7fb;--paper:#fff;--ink:#1b2333;--ink-2:#495468;--ink-3:#7c8698;
  --line:#e3e7ef;--brand:#2f5bea;--brand-soft:#eef3ff;
  --radius:14px;--radius-sm:10px;--shell:1120px;--header-h:70px;
}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Source Han Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.75;
}
h1,h2,h3,h4{color:var(--ink);margin:0;}
p{margin:0 0 12px;color:var(--ink-2);}
a{color:var(--brand);text-decoration:none;}
a:hover{text-decoration:underline;}
.shell{max-width:var(--shell);margin:0 auto;padding:0 22px;}
.skip-link{
  position:absolute;left:-9999px;top:0;background:var(--brand);color:#fff;
  padding:10px 16px;border-radius:0 0 var(--radius-sm) 0;z-index:99;
}
.skip-link:focus{left:0;}

/* ── 站头 ───────────────────────────────── */
.site-top{
  position:sticky;top:0;z-index:50;background:rgba(255,255,255,.96);
  backdrop-filter:saturate(180%) blur(8px);border-bottom:1px solid var(--line);
}
.site-top .shell{display:flex;align-items:center;gap:18px;min-height:var(--header-h);}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none !important;flex:none;}
.brand .logo{
  width:44px;height:44px;border-radius:12px;flex:none;
  background:linear-gradient(135deg,#22336b,#2f5bea 60%,#4b7cf5);
  color:#fff;display:grid;place-items:center;
  font-size:15px;font-weight:700;letter-spacing:.02em;
}
.brand .brand-text{display:flex;flex-direction:column;line-height:1.3;}
.brand .brand-text strong{font-size:17.5px;color:var(--ink);font-weight:700;}
.brand .brand-text small{font-size:11.5px;color:var(--ink-3);letter-spacing:.02em;}
.site-nav{margin-left:auto;display:flex;align-items:center;gap:4px;}
.site-nav a{
  display:block;padding:8px 15px;border-radius:999px;font-size:14.5px;
  color:var(--ink-2);text-decoration:none !important;white-space:nowrap;
  transition:background .18s,color .18s;
}
.site-nav a:hover{background:var(--brand-soft);color:var(--brand);}
.nav-toggle{
  display:none;margin-left:auto;width:42px;height:42px;flex:none;
  border:1px solid var(--line);border-radius:var(--radius-sm);background:#fff;
  color:var(--ink);font-size:19px;line-height:1;cursor:pointer;
}

/* ── 主体 ───────────────────────────────── */
main{display:block;padding-top:34px;}
section.blk{margin-bottom:46px;}
.nf{padding:40px 0 30px;text-align:center;}
.nf-code{
  font-size:64px;font-weight:700;color:var(--brand);
  margin:0 0 6px;line-height:1;
}
.nf-title{
  display:inline-block;font-size:22px;font-weight:700;
  border:none;padding:0;margin:0;
}
.nf-lead{max-width:560px;margin:16px auto 26px;}
.hero-actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:26px;}
.btn{
  display:inline-flex;align-items:center;gap:7px;
  padding:10px 20px;border-radius:999px;font-size:14px;font-weight:600;
  border:1px solid transparent;cursor:pointer;text-decoration:none !important;
  transition:transform .15s,box-shadow .18s,background .18s;
}
.btn-line{background:#fff;color:var(--brand);border-color:#c9d7fb;}
.btn-line:hover{background:var(--brand-soft);}

/* ── 页脚 ───────────────────────────────── */
.site-footer{
  background:#1c2740;color:rgba(255,255,255,.74);
  margin-top:20px;padding:44px 0 0;font-size:13.4px;
}
.footer-bottom{
  border-top:1px solid rgba(255,255,255,.14);
  padding:16px 0 22px;font-size:12.6px;color:rgba(255,255,255,.6);
  display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
}
.site-footer .footer-bottom{border-top:none;}

@media (max-width:768px){
  .site-top .shell{flex-wrap:wrap;padding-top:10px;padding-bottom:10px;gap:10px;}
  .nav-toggle{display:block;}
  .site-nav{
    order:3;width:100%;margin-left:0;display:none;
    flex-direction:column;align-items:stretch;gap:2px;
    padding:8px 0 4px;border-top:1px solid var(--line);
  }
  .site-nav.open{display:flex;}
  .site-nav a{padding:11px 14px;border-radius:var(--radius-sm);font-size:15px;}
  .footer-bottom{flex-direction:column;gap:6px;}
  .nf-code{font-size:52px;}
  .nf-title{font-size:19px;}
}
@media print{
  .site-top,.site-footer,.hero-actions,.nav-toggle{display:none !important;}
  .shell{max-width:none;padding:0;}
}
</style>
</head>
<body>
<a class="skip-link" href="#main">跳到主要内容</a>

<header class="site-top">
  <div class="shell">
    <a class="brand" href="index.html" data-href="index.html">
      <span class="logo">数信</span>
      <span class="brand-text">
        <strong>数信元宇宙</strong>
        <small>一粟</small>
      </span>
    </a>
    <button class="nav-toggle" id="navToggle" aria-label="展开导航菜单" aria-expanded="false" aria-controls="siteNav">☰</button>
    <nav class="site-nav" id="siteNav" aria-label="主导航">
      <a href="index.html" data-href="index.html">首页</a>
      <a href="links.html" data-href="links.html">相关链接</a>
      <a href="training.html" data-href="training.html">AI 训练体系</a>
    </nav>
  </div>
</header>

<main id="main" class="shell">
  <section class="blk nf">
    <p class="nf-code">404</p>
    <h2 class="nf-title">页面不存在或已被移动</h2>
    <p class="nf-lead">您访问的页面地址有误，或该页面已调整位置。请从下方入口重新进入，或返回首页。</p>
    <div class="hero-actions">
      <a class="btn btn-line" href="index.html" data-href="index.html">返回首页</a>
      <a class="btn btn-line" href="links.html" data-href="links.html">相关链接</a>
      <a class="btn btn-line" href="training.html" data-href="training.html">AI 训练体系</a>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="shell">
    <div class="footer-bottom">
      <span>© <span id="year">2026</span> 数信元宇宙 · 一粟</span>
      <span>从上方入口返回首页继续浏览</span>
    </div>
  </div>
</footer>

<script>
/* ── 导航折叠（本页不加载 main.js，故在此内联）────────────── */
(function () {
  var t = document.getElementById('navToggle'), n = document.getElementById('siteNav');
  if (!t || !n) return;
  t.addEventListener('click', function () {
    var open = n.classList.toggle('open');
    t.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
})();

/* ── 页脚年份 ───────────────────────────────────────────── */
(function () {
  var y = document.getElementById('year');
  if (y) y.textContent = new Date().getFullYear();
})();

/* ── 站内链接「根路径自适应」─────────────────────────────────
   404 页的 URL 是「访问者输错的那个地址」，深度不定：
     /sxx-dept-site/typo          → 默认相对路径正好可用
     /sxx-dept-site/a/b           → 默认相对路径会指向 /sxx-dept-site/a/，必须修正
   故依次探测 index.html、../index.html、../../index.html，
   取第一个真实存在的层级作为站点根基准。
   探测全部失败时保留 HTML 里写的相对路径默认值（不破坏一层深的常见情形）。 */
(function () {
  var cands = ['', '../', '../../'];
  function apply(base) {
    var links = document.querySelectorAll('a[data-href]');
    for (var i = 0; i < links.length; i++) {
      links[i].setAttribute('href', base + links[i].getAttribute('data-href'));
    }
  }
  function probe(i) {
    if (i >= cands.length) return;
    fetch(cands[i] + 'index.html', { method: 'HEAD' })
      .then(function (r) { if (r.ok) { apply(cands[i]); } else { probe(i + 1); } })
      .catch(function () { probe(i + 1); });
  }
  probe(0);
})();
</script>
</body>
</html>
